name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex.: 0.1.0). Vazio = ler de pyproject.toml"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Secrets nao podem ser lidos diretamente em `if:`; usa-se env no job.
      SIGN_PFX_B64: ${{ secrets.WINBOT_SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Gates de qualidade
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python -m pyright

      - name: Resolver versao
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          if (-not $v) {
            $v = (python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Instalar Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Localizar ISCC
        shell: pwsh
        run: |
          $candidates = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source,
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe nao encontrado apos instalar o Inno Setup" }
          "WINBOT_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Preparar certificado (opcional)
        if: env.SIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "winbot-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
          "WINBOT_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "WINBOT_SIGN_PASSWORD=${{ secrets.WINBOT_SIGN_PASSWORD }}" >> $env:GITHUB_ENV

      - name: Compilar .exe e instalador
        shell: pwsh
        run: .\scripts\build.ps1 -Installer -Version "${{ steps.ver.outputs.version }}"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: WinBot-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/winbot/winbot.exe
          if-no-files-found: error
